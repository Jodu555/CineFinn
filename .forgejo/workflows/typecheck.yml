name: Typecheck

on: [push, workflow_dispatch]

jobs:
  typecheck:
    runs-on: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npx get-pnpm

      - name: Show versions
        run: |
          node --version
          pnpm --version

      # Install TypeScript globally TODO: This is probably an antipattern and a workaround
      - name: Install TypeScript Globally
        run: pnpm i -g typescript

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build utilities packages
        run: pnpm run build:packages

      - name: Run typecheck
        run: pnpm run typecheck
